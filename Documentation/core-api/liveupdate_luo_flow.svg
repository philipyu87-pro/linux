<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      .title { font: 700 24px "DejaVu Sans", Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px "DejaVu Sans", Arial, sans-serif; fill: #111827; }
      .text { font: 14px "DejaVu Sans", Arial, sans-serif; fill: #111827; }
      .box { fill: #f0f4ff; stroke: #365ebf; stroke-width: 2; rx: 10; ry: 10; }
      .box2 { fill: #eef7f0; stroke: #2f855a; stroke-width: 2; rx: 10; ry: 10; }
      .area { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
      .arrow { stroke: #365ebf; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 6 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto" fill="#365ebf">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <rect class="area" x="20" y="70" width="480" height="400" rx="14" ry="14"/>
  <rect class="area" x="700" y="70" width="480" height="400" rx="14" ry="14"/>
  <text class="label" x="40" y="95">当前内核 (N) / Current kernel</text>
  <text class="label" x="740" y="95">新内核 (N+1) / Next kernel</text>
  <text class="title" x="600" y="45" text-anchor="middle">LUO 热升级流程 / LUO Hot Upgrade Flow</text>
  <rect class="box" x="80" y="130" width="280" height="100"/>
  <text class="text" x="100" y="160">用户态 LUO 代理 / 应用 (userspace agent/app)</text>
  <text class="text" x="100" y="185">ioctl /dev/liveupdate</text>
  <text class="text" x="100" y="210">创建会话、登记待保留的</text>
  <text class="text" x="100" y="235">文件描述符 / 设备状态 (FDs/devices)</text>
  <rect class="box" x="80" y="270" width="280" height="120"/>
  <text class="text" x="100" y="300">LUO 核心 + 子系统回调</text>
  <text class="text" x="100" y="325">freeze 设备与文件、停止新 I/O</text>
  <text class="text" x="100" y="350">序列化会话到 KHO FDT 与</text>
  <text class="text" x="100" y="375">保留内存 (memfd 等) / serialize to KHO</text>
  <rect class="box2" x="460" y="220" width="200" height="100" rx="14" ry="14"/>
  <text class="text" x="560" y="255" text-anchor="middle">kexec 切换 / kexec handover</text>
  <text class="text" x="560" y="280" text-anchor="middle">携带 KHO handover</text>
  <text class="text" x="560" y="305" text-anchor="middle">FDT 与保留页</text>
  <rect class="box" x="840" y="130" width="280" height="120"/>
  <text class="text" x="860" y="160">引导早期: LUO 读取 KHO FDT</text>
  <text class="text" x="860" y="185">重建会话列表、校验代数</text>
  <text class="text" x="860" y="210">为下一步恢复做准备 / prepare restore</text>
  <rect class="box" x="840" y="290" width="280" height="120"/>
  <text class="text" x="860" y="320">LUO 回调解冻设备 / 文件</text>
  <text class="text" x="860" y="345">恢复文件描述符</text>
  <text class="text" x="860" y="370">用户态重新检索会话并</text>
  <text class="text" x="860" y="395">恢复业务运行 / resume workload</text>
  <path class="arrow" d="M220 230 L220 270"/>
  <path class="arrow" d="M360 330 L460 270"/>
  <path class="arrow" d="M660 270 L840 230"/>
  <path class="arrow" d="M980 250 L980 290"/>
  <rect class="box" x="310" y="400" width="240" height="50"/>
  <text class="text" x="430" y="430" text-anchor="middle">保留对象 / preserved: LUO FDT、会话表、memfd 数据、设备状态</text>
  <path class="arrow dashed" d="M320 400 L220 380"/>
  <path class="arrow dashed" d="M550 400 L840 380"/>
</svg>
